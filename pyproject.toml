[project]
name = "clip-pipeline"
version = "0.1.0"
description = "Fortnite-Aufnahmen -> Highlights -> Bewertung per Telegram -> clip-battle.de"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot>=21,<23"]

[project.optional-dependencies]
# Unter Windows fehlt die Zeitzonen-Datenbank; unter Linux bringt sie das System mit.
windows = ["tzdata"]

[project.scripts]
pipeline = "clip_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clip_pipeline = ["schema.sql", "regie.sql", "schemas/*.json"]
