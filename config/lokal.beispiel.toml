# Rechner-eigene Einstellungen. Auf dem Server kopieren:
#   cp config/lokal.beispiel.toml config/lokal.toml
# lokal.toml steht in .gitignore und überschreibt nur die Werte, die hier drinstehen.

[speicher]
# großer Proxmox-Host (pve-big): Erreichbarkeit prüfen und bei Bedarf per Wake-on-LAN wecken
host = "192.168.178.51"
wol_mac = "aa:bb:cc:dd:ee:ff"   # MAC-Adresse von pve-big (Beispielwert)

# --- Lernschleife „Publikum“ (optional, docs/PUBLIKUM.md) ---------------------------------------
# Steht absichtlich hier oben: Regisseur 2.0 hängt seine Beispiele unten an – so kommen sich beide nicht in die Quere.
# Kein claude-Login für den Benutzer pipeline auf diesem Rechner? Dann Zahlen von Hand statt per Screenshot:
# [lernbot]
# screenshot_claude = false
# Findet der Dienst claude nicht (systemd kennt ~/.local/bin nicht), den vollen Pfad eintragen – NUR wenn claude
# unter /home liegt. Den Pfad ermitteln mit `sudo -iu pipeline command -v claude` (unten nur ein Beispiel); liegt er
# in /usr/local/bin oder /usr/bin, nichts eintragen. Achtung: gilt auch für `decide` aus n8n und `stimmung` – ein
# falscher Pfad schaltet Claude dort still ab (Regel-Schnittliste).
# [decide]
# programm = "/home/pipeline/.local/bin/claude"
# Zum Ausprobieren (Abnahme Stufe 1) schon nach 3 statt 7 Tagen bewerten – danach wieder entfernen.
# Erwartet: bewertet mit Score 0 und Vermerk „Basis zu klein“ (unter 5 bewerteten Posts). Scores werden nie
# überschrieben: Posts, die in dieser Zeit bewertet werden, behalten ihre Tag-3-Messung.
# [publikum]
# alter_tage = 3
# Scores reagieren dir zu stark oder zu schwach auf einen Teil? Kleinste Streuung je Teil (Standard und Begründung in
# config/pipeline.toml, [publikum.mad_minimum]: wiedergabe 0.05, engagement 0.005, reichweite 0.1). Nur eintragen,
# was du ändern willst; gilt nur für Scores, die danach gesetzt werden. Beispiel: Engagement-Ausreißer dämpfen:
# [publikum.mad_minimum]
# engagement = 0.01
# Stufe 2 (docs/PUBLIKUM.md, S3/S4). Waffen-Nummern aus `pipeline replay <datei>` – GunType-ZAHLEN, keine Namen:
# [merkmale.waffen]
# sniper = [12]
# nahkampf = [3, 27]
# sonstige = [5]
# Mic-Schritt nach render aus (z. B. wenn logind KillUserProcesses=yes meldet):
# [merkmale]
# mic = false

# --- Regisseur steuern (optional) ---------------------------------------------------------
# Startwerte, von denen aus der Regisseur mit deinen Bewertungen weiterlernt. Nur eintragen, was du ändern willst.
# Ansehen, was gerade gilt:  pipeline lernstand
# [regie.vorgaben]
# seg_min_faktor = 1.3      # ruhiger schneiden: Segmente länger (1.0 = Standard, 0.5 … 2.0); ab 1.3 nur jeder 2. Beat
# dauer_faktor = 0.8        # kürzer: Short 45 s × 0.8 ≈ 36 s, Zusammenschnitt entsprechend (0.6 … 1.0)
# puffer_vor_s = 3.5        # mehr Anlauf vor dem ersten Kill (1 … 6 s)
# puffer_nach_s = 2.0       # länger nach dem letzten Kill (0.5 … 4 s)
# uebergang_faktor = 1.2    # weichere, längere Übergänge
# musik_pegel = 0.3         # Musik leiser (0 … 1)
# effekt_hektik = 0.8       # Beat-Akzente schwächer (0.3 … 1.3; „zu hektisch“ lernt ×0.9)
# [regie.vorgaben.stimmung_bonus]
# lustig = 1.0              # lustige Momente bevorzugen (−2 … +2)
# [regie.vorgaben.effekt_staerke]
# chill = 0.5               # Effekte je Stimmung schwächer/stärker (0 … 1.5, 0 = ohne Effekte; Start 1.0;
# episch = 1.2              # „zu viele Effekte“ lernt ×0.85, „mehr Action“ ×1.15)
# [regie.musik_ziele.episch]
# bpm = 150                 # für epische Momente schnellere Musik
# energie = 0.9             # und energiereichere (Rang in deiner Bibliothek, 0 … 1)
# --- Effekte (Regisseur 2.0) ---------------------------------------------------------------
# Ganz aus (Schnitt und Übergänge wie vorher):
# [regie.effekte]
# an = false
# Einzelne Profilwerte je Stimmung überschreiben (Stärken 0 … 1, 0 = aus; Werte in src/clip_pipeline/effekte.py):
# [regie.effekte.episch]
# punch = 0.5               # sanfterer Zoom auf dem Finisher (Standard 0.7)
# look = "warm"             # Farblook: neutral, cinematic, kalt, warm, entsaettigt, soft
# look_staerke = 0.4
# uebergaenge = [["whip", 0.25], ["schnitt", 0]]   # Rotation der Übergänge in epische Momente
# [regie.effekte.lustig]
# max_ruhe_s = 0            # keine Beat-Akzente (Zoom auf dem Beat nach so vielen Sekunden Ruhe)
