# Konfiguration der Clip-Pipeline.
# Zeiten in Sekunden. Relative Speicherpfade beziehen sich auf [speicher].wurzel,
# relative Programmpfade auf den Projektordner.

[speicher]
# Wurzel des Clip-Speichers. Auf dem Mini ist das der NFS-Mount vom großen Host.
# Im getrennten Betrieb ([lager].wurzel gesetzt) ist das der Puffer auf dem Mini (host = "", weckt nie).
wurzel = "/srv/clips"
# Diese Datei muss in der Wurzel liegen. Fehlt sie (großer Host aus, Mount fehlt),
# fasst die Pipeline nichts an – so wird nie ein leerer Mount-Ordner befüllt.
markierung = ".clip-speicher"
# Optional: Host und Port des Speichers. Wird vor jedem Zugriff kurz angepingt,
# damit ein schlafender NFS-Server die Pipeline nicht hängen lässt. Leer = keine Prüfung.
host = ""
port = 2049
# MAC des großen Hosts: Schläft er, weckt ihn die Pipeline (z. B. für das Highlight-Video am Freitag).
wol_mac = ""
wecken_warten_s = 180
eingang = "eingang"            # Aufnahmen vom Gaming-PC (nvidia/, steelseries/)
replays = "replays"            # Fortnite-Replays
sessions = "sessions"          # je Match ein Ordner: analyse.json, schnittliste.json, clips/, vorschau/, shorts/
highlights = "highlights"      # Highlight-Videos alle 2 Wochen
musik = "musik"                # nur lizenzierte Titel, je Titel eine <name>.lizenz.txt daneben
archiv = "archiv"              # Multikills ab 3 Kills – wird nie aufgeräumt
papierkorb = "papierkorb"

[big]
# Sicherheitsnetz für pve-big (src/clip_pipeline/big.py, Timer clip-big-waechter alle 10 min).
# Host und Port für "ist er wach?" – leer = [speicher].host; Port 22 = SSH.
host = ""
port = 22
# Herunterfahren per SSH mit eigenem Schlüssel (auf pve-big per command= auf clip-big-steuer festgelegt).
# Solange ssh_ziel leer ist oder "pipeline big pruefen" nie geklappt hat, weckt die Pipeline pve-big NICHT.
ssh_ziel = ""                                   # z. B. "root@pve-big"
ssh_schluessel = "/var/lib/clip-pipeline/.ssh/pve-big"
# Nach dem Aufwachen mindestens so lange an lassen (der Gaming-PC hat ihn evtl. gerade geweckt)
mindest_wach_min = 20
aus_warten_s = 180
# Ab dieser Zeit wird pve-big nicht mehr geweckt; läuft er, fährt der Wächter ihn einmal herunter.
# Leer = keine Frist (Standard). Eine befristete Sprint-Regel gehört NICHT hierher (Repo-Standard, öffentlich für
# jede Betriebsart) – sondern ins gitignorte config/lokal.toml auf der jeweiligen Maschine (B1, 26.09.: der letzte
# Sprint-Wert hier hätte die Pipeline nach Ablauf für immer am Wecken gehindert, ohne dass es jemand gemerkt hätte).
frist = ""
# Auch der bisherige Weckweg (n8n-Schritte, /paket, highlight) weckt nur, wenn das Herunterfahren gesichert ist.
# Bis die SSH-Steuerung eingerichtet ist, enden diese Schritte bei schlafendem pve-big mit Exit 3 (Alarm).
alter_weckweg_nur_mit_aus = true
# So lange gilt ein erfolgreicher Test der Steuerung (der Wächter erneuert ihn, solange pve-big läuft).
# 60 statt 14 (E19): mit Puffer ist pve-big oft tagelang aus – danach soll der tägliche Abgleich ihn trotzdem wecken.
status_gueltig_tage = 60

[lager]
# Langzeit-Lager auf pve-big (E19). Leer = kein getrennter Betrieb: [speicher] ist dann direkt pve-big (wie bisher).
# Im getrennten Betrieb: [speicher] = Puffer auf dem Mini (host = ""), Lager = NFS von pve-big.
wurzel = ""                    # z. B. "/srv/big/clips"
markierung = ".clip-lager"     # liegt NUR im Lager (auf pve-big anlegen)
port = 2049                    # "erreichbar?" = TCP [big].host:port
warten_s = 240                 # nach dem Wecken so lange auf die Markierung warten (Nachzieher hängt NFS alle 30 s ein)
ordner = ["eingang", "replays", "sessions", "highlights", "sitzungen", "musik", "archiv", "sicherung"]
roh = ["eingang", "replays"]   # Rohdaten: im Lager nie überschreiben, nie löschen
ruhe_min = 10                  # jüngere Dateien (mtime ODER ctime) gelten als "wird noch geschrieben"
sicherungen_behalten = 30      # so viele tägliche DB-Sicherungen in sicherung/ behalten
# Nachtruhe (Ortszeit, über Mitternacht erlaubt): Schläft pve-big, weckt der Abgleich ihn in dieser Zeit NIE – auch
# nicht beim Nachholen nach einem Neustart des Mini (Persistent=true). Läuft er ohnehin, wird abgeglichen.
# Der Timer steht auf 10:00 (deploy/systemd/clip-lager.timer). Leer = aus; ein Tippfehler ist ein Konfig-Fehler (Exit 2).
nachtruhe_von = "22:00"
nachtruhe_bis = "08:00"

[puffer]
# Puffer auf dem Mini (E19, nur im getrennten Betrieb): hier arbeitet die Pipeline, einmal am Tag (10:00) geht alles
# ins Lager. Die Morgenprüfung läuft um 11:00 (deploy/systemd/clip-puffer-pruefen.timer).
markierung = ".clip-puffer"    # liegt NUR im Puffer
rohdaten_tage = 14             # so viele Tage Rohvideos (eingang/) hält der Puffer; die Übernahme holt so viele (25.09.)
freigeben = false              # Stufe B5 (später, nur mit OK): bestätigte Rohdaten im Puffer löschen
warnung_frei_gb = 20           # Morgenprüfung: Meldung, wenn weniger frei
alarm_frei_gb = 8
# Lager auf pve-big: gemessen beim Abgleich (nur statvfs), gewarnt in der Morgenprüfung. Gelöscht wird nie etwas.
lager_warnung_frei_gb = 200    # Morgenprüfung: Warnung, wenn im Lager weniger frei
lager_alarm_frei_gb = 50
pool_status = "/srv/big/lvm-status.txt"   # Thin-Pool des Mini, schreibt der Host (deploy/pve-mini/clip-lvm-status)
pool_warnung_prozent = 85      # Thin-Pool des Mini (aus pool_status, vom Host geschrieben)
pool_alarm_prozent = 90
lager_spaetestens_h = 36       # offene Dateien, aber seit so vielen Stunden kein erfolgreicher Abgleich → Meldung
pc_status_datei = "sitzungen/pc-status.json"   # schreibt der Gaming-PC (Uebertragung.ps1)
pc_stau_h = 24                 # älteste nicht übertragene Datei auf dem PC älter → Meldung

[material]
# Lokale Kopie auf dem Mini (pipeline material): gleiche Ordner wie in der Speicher-Wurzel.
ordner = "/var/lib/clip-pipeline/material"
# So viel bleibt immer frei
reserve_gb = 2
# Reicht der Platz nicht für alle Rohvideos: je Video nur die letzten Sekunden, verlustfrei (-c copy)
ende_s = 90
# pve-big höchstens so lange für die Kopie wach halten (danach greift der Wächter)
halten_min = 240
stichprobe = 5

[stimmung]
# faster-whisper auf der Mikro-Spur (CPU). "small" braucht ca. 1 GB RAM, int8 ist auf dem Ryzen am schnellsten.
modell = "small"
sprache = "de"
geraet = "cpu"
rechenart = "int8"
threads = 6
# Spitzen: Spielton so viele LU über seinem Median; Jubel: Mikro so viele LU über seinem Median
spitze_lu = 8
jubel_lu = 12
# Momente mit Sicherheit darunter fragt `claude -p` – gesammelt in EINEM Aufruf pro Durchlauf
claude = true
unsicher_unter = 0.35
claude_max = 40
claude_timeout_s = 180

[musik]
# Musik für den Regisseur liegt auf dem Mini (pve-big darf schlafen). Je Titel <name>.lizenz.txt daneben.
ordner = "/var/lib/clip-pipeline/musik"
# 27.09. (Florian: „Techno/Industrial oder Rock/Metal, kein EDM“): Titel aus diesen NCS-Genres bekommen bei der
# Musikwahl genre_bonus Punkte dazu (Stimmung passt = 2, Energie ≤ 1, Tempo ≤ 0,6). Laden: pipeline musik ncs --genre hart
genres_bevorzugt = ["techno", "hardcore", "electronic-rock", "dance-rock", "midtempo-bass"]
genre_bonus = 1.5

[musik.ncs_stimmungen]
# `pipeline musik ncs --stimmung X` sucht auf ncs.io mit diesen Mood-Filtern (IDs aus der NCS-Suche)
episch = [4, 32, 38]        # Epic, powerful, majestic
spannend = [23, 41, 26]     # Suspense, tense, Chasing
lustig = [8, 16, 11]        # Funny, Quirky, Happy
frustriert = [1, 30, 18]    # Angry, Heavy, Restless
chill = [13, 17, 15]        # Laid Back, relaxed, Peaceful

[regie]
# Schnittlisten und Entwürfe des Regisseurs (auf dem Mini)
ordner = "/var/lib/clip-pipeline/regie"
# Entwürfe per VA-API kodieren, wenn /dev/dri da ist (sonst CPU)
vaapi = true
# Lernen aus 👍/👎 ohne Grund erst ab so vielen Bewertungen (Gründe wirken sofort)
lernen_ab = 3
# pve-big höchstens so lange für den Final-Render wach halten
final_halten_min = 60
# Schnittstil (30.09., stile.py): "auto" = der Bot wählt selbst nach den Noten seines Cutter-Kritikers;
# fest: montage, story, steigerung, kino, klassik. Im Lern-Bot unter ⚙️ Einstellungen umstellbar.
stil = "auto"

[regie.kritik]
# Cutter-Kritik (30.09., kritik.py): jeder Entwurf bekommt eine Note 0–100 aus Handwerksregeln und – wenn ki = true –
# vom KI-Cutter (claude -p, nur Leserechte, zählt gegen das Abo). Aus den Noten lernt der Bot selbst.
ki = true
ki_pro_tag = 20            # höchstens so viele KI-Urteile am Tag, danach nur Regeln
timeout_s = 180
gut_ab = 60                # KI-Note ab hier zählt als 👍 im Regie-Lernen, darunter als 👎
schwelle = 50              # darunter sortiert der Lern-Bot den Entwurf still aus und baut neu (0 = aus)
prompt = "templates/kritik-prompt.txt"

[regie.ton]
# Ton-Hygiene im Renderer (30.09., Cutter-Maßstab R1/R3): jedes fertige Video wird in zwei Pässen (loudnorm) auf
# diese Lautheit und diesen True Peak angeglichen – Entwurf, Upload-Fassung und Final (entwurf.normalisiere_ton)
lufs = -14.0
true_peak = -1.5
# Musik-Kanten in Sekunden: einblenden nur gegen Knacken; ausblenden im Short kurz (Loop-Ende), im Zusammenschnitt weich
musik_ein_s = 0.03
musik_aus_s_short = 0.25
musik_aus_s_zs = 2.0

[regie.effekte]
# Regisseur 2.0/2.1: Der Regisseur schreibt einen Effekt-Plan in die Schnittliste (src/clip_pipeline/effekte.py), der
# Renderer setzt ihn nur um. Im Spielbild: Übergänge (gemischt ohne Wiederholung), Zoom, Zeitlupe/Zeitraffer, Farblook
# und seit 28.09. die Impacts Blitz/Wackeln/RGB-Stoß mit wechselndem Stil je Kill; Kill-Titel und Zähler im Short
# nur im unscharfen Rand, im Zusammenschnitt kein Zähler. Profile je Stimmung: effekte.PROFIL, anpassbar in
# config/lokal.toml unter [regie.effekte.<stimmung>] (Beispiele in config/lokal.beispiel.toml).
# Aus = wie vorher (gleiche Übergänge, gleicher Filtergraph):
an = true
# Höchstens so viele Zeitlupen bzw. Zeitraffer je Video (28.09.; 0 = keine)
max_lupen = 8
max_raffer = 6
# steigt, wenn sich die Profilwerte im Code ändern (steht in jeder Schnittliste)
profil_version = 2
# Effekte schwächer als das fallen weg (Stärke 0..1 = Profilwert × gelernte Effekt-Stärke)
schwelle = 0.15
# Zoom-Ereignisse (Punch, Beat-Akzent, Meme) liegen mindestens so weit auseinander
effekt_abstand_s = 0.4
# höchstens so viele Glitch-Übergänge je Video (weitere werden zum Whip)
max_glitch = 1
# selbst erzeugte Sound-Effekte (ffmpeg aevalsrc, lizenzfrei) und ihr Pegel
sfx_ordner = "/var/lib/clip-pipeline/sfx"
sfx_pegel = 0.8
# Kill-Titel in der Schrift aus [shorts].schriften (DejaVu Sans Bold): Breite eines Zeichens / Schriftgröße
titel_zeichenbreite = 0.75

[regie.massstab]
# Cutter-Maßstab 1.0 (30.09., kriterien.py/massstab.py): 14 Kriterien am fertigen Video, ihre Gewichte lernt der Bot
# paarweise aus Lehrern, die die Note nicht kennen (KI-Cutter blind, Publikum, dein 👍/👎). Faktor f je Kriterium.
plattformen = ["tiktok", "youtube"]   # Safe-Zonen für die Lesbarkeit (mit "instagram" strenger)
mindestens = 15            # ab so vielen Entwürfen in Paaren lernt er, darunter f = 1
voll_vertrauen = 60        # Vertrauen = n / voll_vertrauen (höchstens 1)
faktor_min = 0.5
faktor_max = 2.0
beta = 8                   # Steilheit P(a ≻ b) = σ(β·Δ)
l2 = 4                     # Zug zurück zum Handwerks-Start
schritte = 400
lernrate = 0.05
ki_abstand = 10            # KI-Paar erst ab so viel Noten-Unterschied
ki_fenster_tage = 14
ki_budget = 40             # mehr KI-Paare verdünnen ihr Gewicht (min(1, budget/n))
publikum_abstand = 0.2
publikum_fenster_tage = 30
publikum_halb = 8          # ab so vielen Publikums-Videos führt das Publikum zur Hälfte
schwelle_quantil = 0.2
schwelle_min = 40
schwelle_ab_n = 20

[regie.massstab.start.short]
# Startgewichte in Prozent (Spec §2.1), Summe 100 – werden auf 1 normiert
hook = 20
leerlauf = 11
reiztakt = 6
tempokurve = 5
cut_on_action = 3
beat_sync = 5
payoff = 9
bogen = 3
ende = 5
tonmix = 13
spielbild = 6
bild_technik = 5
lesbarkeit = 2
effektdosis = 7

[regie.massstab.start.zusammenschnitt]
hook = 8
leerlauf = 11
reiztakt = 6
tempokurve = 7
cut_on_action = 4
beat_sync = 7
payoff = 11
bogen = 9
ende = 5
tonmix = 15
bild_technik = 8
lesbarkeit = 2
effektdosis = 7

[viral]
# 🔥 Viral-Video (05.10., src/clip_pipeline/viral.py, Florian: „nur den Button drücken – professioneller Schnitt mit einem
# Hauch Humor, lernen aus Daten statt aus 100 Bewertungen“). Im Lern-Bot /viral bzw. Knopf „🔥 Viral-Video“.
# Variante: "auto" = der Bot wählt selbst (Thompson-Sampling über Cutter-Noten und Publikum); fest: twist (Highlights
# mit 1–2 Fails/Gags), highlight, fail. In ⚙️ Einstellungen umstellbar.
variante = "auto"
# KI-Einschätzung je Moment (claude -p, nur Leserecht, zählt gegen das Abo): viral/humor/spannung + Titel aus Fakten.
# Je Moment einmal; danach bzw. darüber gilt die Regel (Startwert).
ki = true
ki_pro_tag = 40            # höchstens so viele Momente am Tag
ki_je_lauf = 12            # je Viral-Entwurf höchstens so viele neue
ki_je_aufruf = 6           # so viele Momente in einem claude-Aufruf
ki_gewicht = 1.0           # Auswahl-Bonus: ki_gewicht × (viral − 50) / 10 Punkte
timeout_s = 240
prompt = "templates/viral-prompt.txt"
versuche_max = 3           # so viele Fassungen baut /viral höchstens; gesendet wird die beste (Cutter-Note)

[viral.prior]
# Startwissen der Variantenwahl als Beta(a, b) – der Twist ist der Hauptweg, die Noten verschieben das
twist = [3.0, 1.0]
highlight = [2.0, 1.0]
fail = [1.0, 1.0]

[viral.werkzeuge]
# Wahrscheinlichkeit je Entwurf (keine Pflicht – was ankommt, lernt das Publikums-Modell)
hook_teaser = 0.6          # 1–1,5 s Teaser des Höhepunkts ganz vorn
tod_lupe = 0.7             # Zeitlupe kurz vor dem Tod eines Fails
tod_standbild = 0.6        # 0,64 s Standbild am Tod

[sitzungen]
# "Session vorbei"-Dateien des Gaming-PCs (windows/Uebertragung.ps1, SessionVorbeiMinuten)
ordner = "sitzungen"
# So lange auf n8n warten, bis alle Matches des Abends verarbeitet sind
warten_h = 2
format = "short"

[lernbot]
# Abends einmal ein Satz zum Stand (Ortszeit)
abendstand = true
abend_uhrzeit = "21:00"
# Nach jeder fertigen Bewertung (✅) sofort den nächsten Entwurf bauen – die Lernschleife
naechster_nach_bewertung = true
# Vor jedem Entwurf so viele weitere Clips analysieren (Stimmung, Whisper) – die Auswahl wächst mit; 0 = aus
stimmung_je_entwurf = 10
intervall_s = 30
# B5 (28.09., Florian: „nicht jeden Entwurf bewerten müssen, will aber sagen was hochgeladen wird“): Entwürfe, deren
# Erwartung (erwartung.py) unter dieser Schwelle liegt, bekommst du gar nicht erst gezeigt – der Bot verwirft sie
# still (entwuerfe.auto_verworfen) und baut automatisch den nächsten. 0 = aus (wie bisher: jeder Entwurf kommt zu
# dir). Ohne genug Urteile gibt es noch keine Erwartung – dann kommt der Entwurf immer, die Schwelle greift erst,
# sobald das Modell steht ([erwartung].mindest_urteile).
auto_schwelle = 0.0
# So oft in Folge automatisch neu gebaut wird, bevor der letzte Versuch trotzdem gesendet wird (nie unbegrenzt
# weiterrendern – Rendern ist der teure Schritt, Mini-PC hat nur eine Sperre gleichzeitig).
auto_versuche_max = 3
# Lernschleife „Publikum“ (Spec §7.1): Screenshots der TikTok-Statistik per `claude -p` lesen (1 Aufruf je Bild,
# zählt gegen dein Abo). false = der Bot fragt die Zahlen gleich von Hand ab (views likes wiedergabe voll%,
# optional dahinter kommentare shares saves).
# Braucht einen claude-Login für den Benutzer pipeline, den der Dienst sehen darf (docs/PUBLIKUM.md, Installation).
screenshot_claude = true
# Fester Auftrag an claude (Platzhalter {bild} = Bildname). Relativ zum Projektordner (/opt/clip-pipeline), nicht zu
# [speicher].wurzel
screenshot_prompt = "templates/screenshot-prompt.txt"
# Nach so vielen Sekunden wird claude abgebrochen → der Bot bittet um die Zahlen von Hand (der Aufruf wird trotzdem
# gezählt – claude lief ja bis dahin)
screenshot_timeout_s = 120

[publikum]
# Lernschleife „Publikum“ (Spec §5, §6, docs/PUBLIKUM.md). Uhrzeit des täglichen Laufs `pipeline publikum bewerten`:
# nur in deploy/systemd/clip-publikum.timer (wie bei clip-lager – eine Wahrheit).
# Für diese Plattformen entstehen Posts (Clip-Bot: Häkchen/Link; Lern-Bot: Häkchen/Link). clip-battle.de nie.
plattformen = ["tiktok"]
# Der Score nimmt die Messung, die diesem Post-Alter (Tage) am nächsten liegt, und wird erst ab diesem Alter gesetzt
alter_tage = 7
# Messungen jünger als das zählen nicht (die ersten Tage verteilt TikTok noch)
mindest_alter_tage = 3
# Vergleichsbasis: so viele zuletzt bewertete Posts derselben Plattform
fenster = 20
# Publikums-Paare fürs Lernen (Stufe 2): Mindestabstand der Scores und höchstens so viele jüngste Paare
paar_abstand = 0.5
max_paare = 200
# Upload-Fassungen der Entwürfe (1080×1920) – relativ zu [speicher].wurzel, im Puffer-Betrieb also /srv/puffer/export
upload_ordner = "export"

[publikum.gewichte]
# Score = 0,5·Wiedergabe + 0,3·Engagement + 0,2·Reichweite (je als z-Wert gegen deine letzten Posts).
# Ohne Wiedergabe werden Engagement und Reichweite auf 1 hochgerechnet (0,6/0,4).
wiedergabe = 0.5
engagement = 0.3
reichweite = 0.2

[publikum.mad_minimum]
# Kleinste Streuung (MAD) je Score-Teil, mit der z gerechnet wird: z = (x − Median) / (1,4826 · max(MAD, Minimum)).
# Warum ein Minimum: Liegen deine letzten Posts fast gleich, wäre der MAD fast 0 und schon ein winziger Unterschied
# gäbe einen riesigen z-Wert. Warum je Teil (Florian 25.09.; Spec §6.3 sagt pauschal 0,05): Die drei Teile haben
# ganz verschiedene Größenordnungen. Scores werden nie überschrieben – eine Änderung gilt nur für neue Scores.
# Die drei Werte selbst sind Annahme A44 (docs/ENTSCHEIDUNGEN.md), bis Florian sie bestätigt.
# Wiedergabe r = gesehener Anteil des Videos (0 … 1,2) – 0,05 = 5 Prozentpunkte, wie in der Spec
wiedergabe = 0.05
# Engagement e = Reaktionen je View, liegt um 0,05 und streut nur um ~0,01. Mit 0,05 als Minimum wäre ein
# Engagement-Ausreißer fast wirkungslos: e 0,09 gegen 0,05 … 0,09 ergäbe z 0,27 statt 1,35. 0,005 = die halbe
# übliche Streuung – greift nur, wenn deine Posts wirklich fast gleich sind.
engagement = 0.005
# Reichweite v = ln(1 + Views) streut in ganzen Einheiten (1 000 Views ≈ 6,9; 10 000 ≈ 9,2). 0,1 ≈ 10 % mehr Views
# (ln 1,1 ≈ 0,095) – kleinere Unterschiede in der Reichweite sind Zufall der TikTok-Verteilung.
reichweite = 0.1

[datenbank]
# Liegt auf dem Mini (immer an), nicht auf dem Speicher.
pfad = "/var/lib/clip-pipeline/pipeline.db"

[zeit]
zeitzone = "Europe/Berlin"
# Gemessen am 21.09.2026 (Build 42.20): Fortnite schreibt die Replay-Startzeit in Ortszeit.
replay_start_ist_ortszeit = true
# Ein Spielabend endet um 06:00 – Runden nach Mitternacht zählen zum Vorabend.
tageswechsel_stunde = 6

[replay]
# Das erste vorhandene Programm wird genommen: Linux-Build (Server) bzw. Windows-Build (.exe).
# Bauen: siehe README, Abschnitt "Replay-Parser".
programm = ["tools/replay2json/bin/linux-x64/replay2json", "tools/replay2json/bin/out/replay2json"]
# Deine Epic-ID (zeigt `pipeline replay <datei>` an). Leer = automatische Erkennung.
# Der echte Wert steht bewusst NICHT hier (das Repo ist öffentlich), sondern in .env als CLIP_EPIC_ID=…
# oder in config/lokal.toml unter [replay] ich = "…" (beide in .gitignore).
ich = ""
# Ein Replay gilt als fertig, wenn es so lange nicht mehr verändert wurde.
ruhezeit_s = 120
# Höchstdauer für das Auslesen eines Replays
timeout_s = 120

[quellen]
# Dateien, die jünger sind, werden evtl. noch kopiert und deshalb erst später erfasst.
ruhezeit_s = 60

[quellen.nvidia]
# Bei .DVR (Videobeweis) und Highlights ist die Uhrzeit im Namen das ENDE des Clips.
# Gemessen am Kill-Zähler im Bild (23.09.2026, 2 Clips): Das echte Ende liegt 0,9–1,9 s
# nach der Uhrzeit im Namen (Nvidia rundet auf ganze Sekunden) -> Mittelwert 1,4 s.
versatz_s = 1.4
# Ereignis liegt so viele Sekunden vor dem (korrigierten) Ende; nur für den Fall ohne Replay.
nachlauf_s = 5.4

[quellen.steelseries]
# recording_timestamp aus den Metadaten = Ende des Clips.
# Gemessen am Kill-Zähler im Bild: Abweichung unter 0,5 s -> kein Versatz nötig.
# (Die Ereignis-Marker selbst liegen ca. 1,5 s nach dem Kill; das betrifft nur den Fall ohne Replay.)
versatz_s = 0.0

[auswahl]
# Wenn mehrere Aufnahmen einen Moment enthalten: zuerst die mit der besten Abdeckung,
# bei Gleichstand gilt diese Reihenfolge.
prioritaet = ["nvidia_aufnahme", "nvidia_dvr", "steelseries", "nvidia_highlight"]

[vorbewertung]
multikill_fenster_s = 10.0
puffer_vorne_s = 8.0
puffer_hinten_s = 5.0
# Bis zu dieser Länge gibt es keinen Längen-Abzug
laenge_frei_s = 30.0
# Punkte nach Anzahl Kills in einer Gruppe: Index = Kills, ab 4 gilt der letzte Wert
kill_punkte = [0, 1, 3, 6, 10]
# Lautstärke-Merkmal: so viele LU über dem Durchschnitt der Aufnahme ergeben 1,0
lautstaerke_spanne_lu = 15.0

[vorbewertung.startgewichte]
kill_punkte = 1.0
victory_royale = 5.0
laenge = -0.5
lautstaerke = 1.0
# Stufe 2 (Spec §8.1): Florians Vorgaben, nicht gelernt. Leine wie oben – bei Startwert 0 also ±0,5.
platzierung = 2.0      # 1/Platz: Sieg 1,0 → +2, Platz 10 → +0,2
sniper = 1.0           # Anteil Sniper-Kills
nahkampf = 0.0         # Anteil Shotgun/SMG/Spitzhacke – neutral, das Lernen entscheidet
bot_opfer = -2.0       # Anteil Bot-Opfer: ein reiner Bot-Clip verliert 2 Punkte
phase = 0.5            # 0 = Match-Start … 1 = Ende: späte Momente leicht bevorzugt
endgame = 1.0          # beim Kill höchstens [merkmale].endgame_spieler übrig
clutch = 2.0           # selbst am Boden gewesen und trotzdem den Kill geholt
mic_lachen = 1.0       # Wortzähler aus dem Transkript, je auf 3 gedeckelt
mic_jubel = 1.0
mic_frust = 0.5
mic_laut = 0.5         # laute Mikro-Spitzen, auf 3 gedeckelt
spitzen = 0.25         # Spielton-Spitzen, auf 4 gedeckelt

[merkmale]
# Neue Merkmale aus Replay und Mikro (Spec §8.1, src/clip_pipeline/merkmale.py)
endgame_spieler = 10   # Endgame: beim Kill höchstens so viele Spieler übrig
clutch_vor_s = 30.0    # Clutch: selbst umgehauen höchstens so lange vor dem Kill …
clutch_nach_s = 10.0   # … und danach so lange nicht gestorben
mic = true             # Mic-Analyse im Hintergrund nach render (Whisper, nice 15); false = aus
mic_je_lauf = 3        # höchstens so viele Clips je Hintergrundlauf (Whisper ~30–60 s je Clip, hält die Sperre)

[merkmale.waffen]
# GunType-ZAHLEN aus replay2json (kein Name – FortniteReplayReader 3.1.0 liest nur ein Byte und kennt keine Namen).
# Kalibrieren mit `pipeline replay <datei>` an bekannten Kills (docs/PUBLIKUM.md). Nicht eingetragene Zahlen zählen
# als sonstige und kommen einmal als Sammelmeldung je Match (Annahme S2-A4).
sniper = []
nahkampf = []          # Shotgun, SMG, Spitzhacke
sonstige = []          # bekannte andere Waffen (schaltet die Meldung für diese Zahl ab)

[fail]
# Fail-Momente (05.10., src/clip_pipeline/fail.py): je eigenem Tod ein Moment aus dem Rohvideo im Puffer – automatisch
# im Mic-Schritt nach render (clip-mikro), von Hand `pipeline fail --session ID` bzw. `--nachziehen [--tage 14]`
an = true
vor_s = 12.0             # so lange vor dem Tod beginnt der Moment
nach_s = 3.0             # so lange danach endet er
kills_fenster_s = 30.0   # eigene Kills so lange vor dem Tod zählen als Fallhöhe
knock_fenster_s = 30.0   # selbst umgehauen so lange vorher zählt
kills_deckel = 4
auto_tage = 2            # nach render: Matches der letzten n Tage prüfen (Vorhandenes wird übersprungen)
mic_je_lauf = 2          # Whisper für so viele Fail-Momente je Lauf

[fail.gewichte]
# Startwert/Rückfall des Fail-Scores, solange keine KI-Einschätzung da ist (viral.py)
platz_10 = 2.0           # beim Tod höchstens Platz 10
platz_3 = 3.0            # zusätzlich, wenn höchstens Platz 3
kill_vorher = 1.0        # je eigener Kill in den 30 s davor (Fallhöhe)
bot = 3.0                # vom Bot erledigt
selbst = 2.5             # selbst erledigt (Sturm, Sturz, eigene Explosion)
knock = 0.5              # vorher selbst umgehauen
mic_frust = 0.5          # je Frust-Wort (Deckel 3)
mic_laut = 0.5           # je laute Mikro-Stelle (Deckel 3)
mic_lachen = 0.75        # je Lachen (Deckel 3)

[lernen]
# Erst ab so vielen Bewertungen (Freigaben/Verwerfungen + Battles + Entwurf-Bewertungen) wird gelernt. 27.09. (B3): 10 statt 20 – das
# Vertrauen wächst ohnehin mit n (10 von 60 = 17 %), und die Schranken (nie schlechter als die Startgewichte) bleiben.
mindestens = 10
# Ab so vielen Bewertungen voll vertrauen
voll_vertrauen = 60
schritt = 0.05
durchlaeufe = 5
# Leine: Gewicht bleibt innerhalb ±50 % seines Startwerts (mindestens ±0,5)
leine_anteil = 0.5
leine_minimum = 0.5
max_paare_pro_abend = 20
# Stufe 2 (Spec §8.3): Freigabe-Paare zählen halb – eine Freigabe ist nur ein indirekter Vergleich, ein Battle direkt
gewicht_freigabe = 0.5
# 06.10.: dein 👍/👎 im Lern-Bot lehrt auch die Formel, die Momente auswählt (vorher nur den Bonus genau dieser
# Momente). Je Moment die Summe deiner Urteile, Plus-Momente > Minus-Momente; zählt halb wie eine Freigabe.
gewicht_entwurf = 0.5
max_paare_entwurf = 300
# Erst ab so vielen Publikums-Paaren prüft die Schranke „nie schlechter als der Start“ auch die Publikums-Quote
# (angezeigt wird sie ab dem ersten Paar; Annahme S2-A10)
mindest_publikum_paare = 10

[erwartung]
# Wie wahrscheinlich gibst du frei? (Spec §10.5, src/clip_pipeline/erwartung.py)
mindest_urteile = 10   # darunter keine Erwartung („noch keine“)
referenz = 50          # z gegen die letzten so vielen gesendeten derselben Art
schritte = 50          # Gradientenabstieg je Schätzung
lernrate = 0.1         # Schrittweite des Gradientenabstiegs (Spec nennt keine; Annahme)
l2 = 0.1               # Strafe auf a und b (nicht c), damit wenige Urteile nichts Extremes lernen
start_a = 1.0
start_b = 0.5
start_c = 0.0
mad_minimum = 0.25     # Mindest-Streuung der Moment-Scores (Punkte-Skala, nicht Publikums-Skala; Annahme)

[elo]
# Variante A aus clips_voter (src/community_clip_os.py)
start = 1500.0
unsicherheit_start = 350.0
unsicherheit_min = 75.0
unsicherheit_faktor = 0.94

[saison]
# Saisons à 14 Tage, beginnend an diesem Montag; Elo wird nie zurückgesetzt.
start = "2026-09-21"
tage = 14

[decide]
# claude -p justiert Schnittpunkte und schlägt eine Beschreibung vor (Max-Abo, nur Leserechte).
# Jede Antwort wird gegen ein Schema und die Kill-Zeiten geprüft; sonst gilt der Regel-Vorschlag.
claude = true
programm = "claude"
timeout_s = 180

[sperre]
# Nur ein rechenintensiver Schritt gleichzeitig; ein zweiter wartet so lange
warten_s = 7200

[highlight]
max_clips = 12
max_dauer_s = 180
ueberblendung_s = 0.6
breite = 1920
hoehe = 1080
fps = 60
# Musik-Lautstärke (0..1); wird zusätzlich unter dem Spielton abgesenkt ("Ducking")
musik_pegel = 0.35

[schnitt]
# Auf dem Server mit durchgereichter iGPU: "h264_vaapi"
encoder = "libx264"
crf = 18
vaapi_geraet = "/dev/dri/renderD128"

[vorschau]
max_mb = 48
kurze_seite = 720

[shorts]
# unschaerfe = ganzes Bild + unscharfer Hintergrund · zuschnitt = nur die Mitte · mit-cam = Cam oben
layout = "unschaerfe"
# 1.0 = ganzes Spielbild (klein), 1.3 = größer, schneidet aber Minimap/Killfeed am Rand an
zoom = 1.0
overlay = true
overlay_text = "clip-battle.de"
# Höhe des Overlays (Anteil der Bildhöhe). Oben ist frei; unten und rechts liegen die Knöpfe der Apps.
overlay_y = 0.12
endcard = true
endcard_s = 2.5
crf = 20
max_kbit = 12000
# Erste vorhandene Schrift wird benutzt (ohne Schriftdatei stürzt drawtext unter Windows ab)
schriften = [
  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
  "C:/Windows/Fonts/arialbd.ttf",
  "C:/Windows/Fonts/arial.ttf",
]
# Nur für layout = "mit-cam": Cam-Ausschnitt im Originalvideo (Pixel)
# [shorts.cam]
# x = 1500
# y = 700
# b = 400
# h = 300

[veroeffentlichung]
# Einzelne Momente werden nicht hochgeladen (Entscheidung 26.09.): kein 📦-Knopf, keine Erinnerung. Hochgeladen werden
# die Shorts aus dem Lern-Bot und das Highlight-Video (Erinnerung bis „✅ Hochgeladen“). pflicht/zusatz gelten nur noch,
# wenn du einen Clip doch per /paket bzw. /link einträgst – erst wenn alle Pflicht-Plattformen erledigt sind: "veröffentlicht".
pflicht = ["youtube", "tiktok"]
# Zusätzlich nachverfolgt (optional): Einreichen des YouTube-Links auf clip-battle.de
zusatz = ["clipbattle"]
# Erinnerung an offene Uploads (Stunden)
erinnerung_h = 24

[telegram]
outbox_intervall_s = 30
# Ruhezeit (Ortszeit, über Mitternacht erlaubt). Gilt IMMER – auch ohne getrennten Betrieb ([lager] leer):
#  - Meldungen aus Puffer/Lager werden dann nicht verschickt, sie bleiben bis leise_bis liegen;
#  - Clip- und Highlight-Videos kommen weiter sofort, aber ohne Ton (disable_notification);
#  - andere Meldungen (z. B. Kills ohne Aufnahme) wie bisher.
# Abschalten: leise_von = "" (leer lassen), z. B. in config/lokal.toml.
leise_von = "23:00"
leise_bis = "08:00"

[auto_freigabe]
# Der Clip-Bot entscheidet selbst (30.09., Florian: „nicht jeden Clip per Hand separat freigeben“,
# src/clip_pipeline/auto_freigabe.py). Werte aus ⚙️ im Bot gehen vor. Automatische Entscheidungen zählen nie beim Lernen.
modus = "an"            # an · probe (nur anzeigen, nichts entscheiden) · aus (alles wie früher, auch keine Frist)
vollautonom = true      # jeden Clip sofort selbst entscheiden – ohne Referenz-Urteile von dir (Florian 30.09.)
ziel_quote = 0.9        # so oft muss die Erwartung im Band gestimmt haben (float, sonst lehnt ⚙️ ab)
verwerfen = true        # automatisch aussortieren – immer weich (bleibt Material), nie bei Triple+/Victory
frist_h = 24            # danach entscheidet der Bot offene Clips selbst; 0 = nie (int)
regel_gruppe = 3        # ab dieser Serie sofort frei
stufen_frei = [0.95, 0.9, 0.85, 0.8]   # mögliche Freigabe-Schwellen der Erwartung, unter 0,8 nie
stufen_weg = [0.05, 0.1, 0.15]         # mögliche Aussortier-Schwellen
fenster = 30            # letzte n Urteile von dir je Band
mindest_n = 15          # darunter zählt eine Stufe nicht
stichprobe_jede = 0     # 0 = keine Stichproben; ab 2 kommt jeder n-te Sofort-Vorschlag trotzdem zu dir
frist_je_lauf = 20      # höchstens so viele Frist-Entscheidungen je Outbox-Runde (30 s)

[aufraeumen]
# Nie automatisch löschen ist der Standard (Entscheidung 25.09.) – aus, bis ausdrücklich auf true gesetzt
# (z. B. in config/lokal.toml, für Betriebsarten ohne [lager]-Abgleich). Im getrennten Betrieb (E19) bleibt
# aufraeumen unabhängig davon immer gesperrt (siehe aufraeumen.pruefe_erlaubt).
aktiv = false
# Nach so vielen Tagen wird recycelt (erst Papierkorb, dann endgültig) ...
nach_tagen = 182
papierkorb_tage = 14
# ... außer Multikills ab dieser Größe: die werden für immer archiviert.
archiv_ab_kills = 3

[caption]
vorlage = "templates/caption.txt"
# Reines Fail-Video (🔥 Viral, 05.10.): Mitmach-Frage und „Größter Fail der Woche – stimm ab auf clip-battle.de“
vorlage_fail = "templates/caption-fail.txt"
beschreibungen = "templates/beschreibungen.toml"
# Optional: `claude -p` formuliert die Beschreibung um (nur mit Faktenprüfung)
ki = false
ki_timeout_s = 90
max_laenge = 150
