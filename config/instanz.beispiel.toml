# Vorlage: Konfig der Instanz eines Freundes (Mehrbenutzer M1) – liegt als /var/lib/clip-benutzer/<name>/instanz.toml.
# Gehört root (root:clip-<name>, 0640): Der Freund kann sie lesen, aber nicht ändern.
# deploy/benutzer/benutzer-anlegen.sh schreibt sie aus Florians wirksamer Konfig (nur Sperre, Rechnerwerte, Waffen).
#
# Startwissen ist config/pipeline.toml aus dem Repo (nie Florians lokal.toml). Hier stehen nur Abweichungen, und nur in
# diesen Abschnitten: [sperre], [schnitt], [zeit], [merkmale.waffen], [instanz], [briefkasten]. Alles andere – Pfade,
# Datenbank, Lager, pve-big, Hosts, KI-Programm – ist ein Konfig-Fehler (pipeline endet mit Exit 2): Die Pfade legt
# die Pipeline selbst unter dem Instanz-Ordner fest. Zugänge (Bot-Token, Telegram-Zahl, Epic-ID, Claude-Token) stehen in
# <Ordner>/.env; der Schlüssel für den Briefkasten liegt fest in <Ordner>/briefkasten/.

[sperre]
# Pflicht: die EINE Rechen-Sperre des Mini – Florians Datei (im Dienst nur lesbar eingebunden). Absolut, außerhalb des
# Instanz-Ordners; sonst rechnete der Freund neben Florian her.
datei = "/var/lib/clip-pipeline/pipeline.lock"
# So lange wartet ein Schritt höchstens auf die Sperre, danach übernimmt der nächste Lauf (fehlt der Wert: 900 s)
warten_s = 900

[schnitt]
# Rechnerwerte wie bei Florian – sonst schneidet der Freund auf dem Prozessor und hält die Sperre länger
encoder = "h264_vaapi"
vaapi_geraet = "/dev/dri/renderD128"

[zeit]
zeitzone = "Europe/Berlin"

[merkmale.waffen]
# Spielwissen wie bei Florian: GunType-Zahlen aus replay2json
sniper = []
nahkampf = []
sonstige = []

[instanz]
# Optional: eigenes claude-Programm (absoluter Pfad,
# nie unter /home, /root, /var/lib/clip-pipeline oder /opt/clip-regie).
# Leer = „claude“ aus /usr/local/bin, /usr/bin oder /bin. Die KI läuft nur mit dem eigenen Claude-Zugang des Freundes
# (per /claude in seinem Bot oder CLAUDE_CODE_OAUTH_TOKEN in .env) – sonst bleibt sie bei ihm aus.
# claude = "/usr/local/bin/claude"

# [briefkasten]
# Stufe 2: der Briefkasten des Freundes auf dem vServer – trägt benutzer-anlegen.sh (Schritt „Briefkasten“) ein, nicht
# von Hand. Erst das Update einspielen, dann den Abschnitt (sonst kennt der Code ihn nicht: Exit 2).
# host = "100.64.0.7"                  # Tailnet-Adresse des vServers
# port = 2222
# oeffentlich = "vserver.example.org"  # öffentlicher Name – nur fürs PC-Paket
