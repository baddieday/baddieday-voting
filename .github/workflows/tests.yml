name: Tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Medienwerkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Abhängigkeiten
        run: python -m pip install -e .
      - name: Autonomie und Produktgrenzen
        run: python -m unittest tests.test_autonom tests.test_publikum_adapter tests.test_regie_dauer -v
      - name: Bestehende Regressionen einschließlich echter Renderläufe
        run: python -m unittest discover -s tests -t .
