# Drop-in für clip-lernbot.service: damit der Lern-Bot `claude -p` starten kann – Claude liest die Zahlen aus
# Screenshots der TikTok-Statistik (Spec §7.1, Annahme A17 im Plan Stufe 1). Einrichtung mit Probe: docs/PUBLIKUM.md,
# Installation P2. Ein Drop-in ergänzt die Haupt-Unit, ohne sie zu ändern – die bleibt, wie sie ist.
#
# Warum: clip-lernbot.service hat ProtectHome=true, dann sieht der Dienst /home gar nicht. claude liegt aber in
# /home/pipeline/.local/bin, seine Anmeldung in /home/pipeline/.claude.json und /home/pipeline/.claude/.
#   ProtectHome=read-only         /home ist sichtbar, aber nur lesbar (ersetzt das „true“ der Haupt-Unit).
#   ReadWritePaths=-/home/pipeline
#                                 Nur das Home des Dienst-Benutzers darf beschrieben werden: claude schreibt
#                                 ~/.claude.json per Temp-Datei und Umbenennen daneben – die Datei allein freizugeben
#                                 reichte nicht. „-“: fehlt der Ordner, startet der Bot trotzdem (ohne „-“ gar nicht).
#                                 Die Zeile ERGÄNZT die Liste der Haupt-Unit (/var/lib/clip-pipeline usw. bleiben
#                                 beschreibbar); eine leere Zeile „ReadWritePaths=“ würde sie dagegen löschen.
#   DISABLE_AUTOUPDATER=1         claude aktualisiert sich im Dienst nicht selbst – du aktualisierst von Hand und
#                                 weißt so, welche Version läuft (der Schalter --no-session-persistence muss da sein).
# PATH: systemd kennt ~/.local/bin nicht. Deshalb claude mit vollem Pfad in config/lokal.toml (Beispiel in
# config/lokal.beispiel.toml):
#   [decide]
#   programm = "/home/pipeline/.local/bin/claude"
# Derselbe Schlüssel gilt auch für decide und stimmung – dort ist der volle Pfad ebenso richtig.
# Kein claude-Login für pipeline? [lernbot].screenshot_claude = false – der Bot fragt die Zahlen dann von Hand ab.
#
# Installieren:  sudo mkdir -p /etc/systemd/system/clip-lernbot.service.d
#                sudo cp deploy/systemd/clip-lernbot.service.d/claude.conf /etc/systemd/system/clip-lernbot.service.d/
#                sudo systemctl daemon-reload && sudo systemctl restart clip-lernbot
# Prüfen:        systemctl cat clip-lernbot   (zeigt Haupt-Unit und dieses Drop-in darunter)
[Service]
ProtectHome=read-only
ReadWritePaths=-/home/pipeline
Environment=DISABLE_AUTOUPDATER=1
