# Drop-in für clip-lernbot.service: damit der Lern-Bot `claude -p` starten kann – Claude liest die Zahlen aus
# Screenshots der TikTok-Statistik (Spec §7.1, Annahme A17 in docs/ENTSCHEIDUNGEN.md). Einrichtung mit Probe:
# docs/PUBLIKUM.md, Installation P2. Ein Drop-in ergänzt die Haupt-Unit, ohne sie zu ändern – die bleibt, wie sie ist.
#
# Warum: clip-lernbot.service hat ProtectHome=true, dann sieht der Dienst /home gar nicht. claude liegt je nach
# Installation in /home/pipeline/.local/bin (install.sh) oder global (/usr/local/bin); im ersten Fall muss /home
# wenigstens lesbar sein.
#   ProtectHome=read-only         /home ist sichtbar, aber nur LESBAR (ersetzt das „true“ der Haupt-Unit).
#   CLAUDE_CONFIG_DIR=/var/lib/clip-pipeline/claude
#                                 claude hält Anmeldung, Einstellungen und Verlauf hier statt in ~/.claude*. Der
#                                 Ordner ist schon beschreibbar (ReadWritePaths der Haupt-Unit); einmal eigens
#                                 anmelden (P2). Die Anmeldung für `decide` aus n8n im Home bleibt davon unberührt.
#   Warum nicht einfach das Home beschreibbar machen? Dort liegen ~/.ssh/authorized_keys mit der Sperre des
#   n8n-Schlüssels (command="…/n8n-lauf.sh") und die claude-Datei, die `decide` aus n8n ohne jeden Schutz startet. Ein
#   Fehler im Lern-Bot (er nimmt Fotos und Dateien an, startet ffmpeg und claude) könnte beides ändern – und so die
#   Sperre umgehen. Einzelne Pfade schreibschützen (ReadOnlyPaths=~/.ssh …) reicht nicht: Es bleiben immer weitere
#   Stellen (die claude-Datei selbst, ~/.claude/settings.json mit Hooks, ~/.gitconfig …). Also bleibt das Home zu.
#   DISABLE_AUTOUPDATER=1         claude aktualisiert sich im Dienst nicht selbst – du aktualisierst von Hand und
#                                 weißt so, welche Version läuft (der Schalter --no-session-persistence muss da sein).
# PATH: systemd kennt ~/.local/bin nicht. NUR wenn claude unter /home liegt (nachsehen: `sudo -iu pipeline command -v
# claude`), den vollen Pfad in config/lokal.toml eintragen, z. B.:
#   [decide]
#   programm = "/home/pipeline/.local/bin/claude"
# ACHTUNG: Derselbe Schlüssel gilt auch für `decide` aus n8n und für `stimmung`. Ein falscher Pfad schaltet Claude dort
# still ab (dann gilt die Regel-Schnittliste). Liegt claude in /usr/local/bin oder /usr/bin: lokal.toml NICHT ändern.
# Kein claude-Login für den Dienst? [lernbot].screenshot_claude = false – der Bot fragt die Zahlen dann von Hand ab.
#
# Installieren:  sudo mkdir -p /etc/systemd/system/clip-lernbot.service.d
#                sudo cp deploy/systemd/clip-lernbot.service.d/claude.conf /etc/systemd/system/clip-lernbot.service.d/
#                sudo systemctl daemon-reload && sudo systemctl restart clip-lernbot
# Prüfen:        systemctl show clip-lernbot -p ProtectHome -p ReadWritePaths -p Environment
#                (die WIRKSAMEN Werte – auch wenn weitere Drop-ins wie e19-puffer.conf daneben liegen)
[Service]
ProtectHome=read-only
Environment=CLAUDE_CONFIG_DIR=/var/lib/clip-pipeline/claude
Environment=DISABLE_AUTOUPDATER=1
