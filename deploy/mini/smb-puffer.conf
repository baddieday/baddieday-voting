# /etc/samba/smb.conf im CT "clips" – Freigabe des Puffers für den Gaming-PC (E19, docs/PUFFER.md R2).
# Eingerichtet von deploy/mini/samba-einrichten.sh (prüft sie mit testparm, bevor sie gilt).
# Ersetzt die Debian-Vorgabe ganz: keine [homes], keine Drucker. Nach Änderungen: testparm, dann systemctl restart smbd.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = clips (Puffer)
   # Nur SMB3 (Windows 10/11 können das); alte, unsichere Protokolle bleiben aus
   server min protocol = SMB3
   # Kein NetBIOS (Ports 137-139): der PC verbindet sich direkt per IP auf Port 445
   disable netbios = yes
   smb ports = 445
   # Nur im Heimnetz lauschen – nicht auf tailscale0
   interfaces = lo eth0
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.178.0/24
   # Kein Gastzugang: falsches Passwort = abgelehnt
   map to guest = never
   restrict anonymous = 2
   # Keine Drucker
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # Protokoll klein halten (je Gegenstelle eine Datei)
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

[clips]
   comment = Puffer auf dem Mini
   path = /srv/puffer
   valid users = gamingpc
   read only = no
   browseable = yes
   # Alles, was der PC schreibt, gehört pipeline – so darf die Pipeline es verarbeiten
   force user = pipeline
   force group = pipeline
   create mask = 0644
   directory mask = 0755
   # NUR .aktiv ausblenden. veto files vergleicht JEDEN Namen auf JEDER Ebene: ein Eintrag wie /highlights/ ließe
   # eingang\nvidia\highlights still verschwinden. Deshalb hier nie Ordner der Pipeline eintragen.
   veto files = /.aktiv/
   # "Gespeichert" meldet Samba erst, wenn es wirklich auf der Platte ist, sobald der PC danach fragt (flush)
   strict sync = yes
